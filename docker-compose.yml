services:
  api:
    build: .
    image: crop-disease-api:local
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.pt
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
